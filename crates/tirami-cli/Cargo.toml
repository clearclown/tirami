[package]
name = "tirami-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
authors.workspace = true

[[bin]]
name = "tirami"
path = "src/main.rs"

[[bin]]
name = "tiramisu"
path = "src/daemon.rs"

# Relayed to `tirami-infer` through both dependency paths (direct, and via
# `tirami-node`) so a single `--features cuda` reaches every copy of the
# llama.cpp build. Covers both the `tirami` and `tiramisu` binaries.
[features]
default = []
metal = ["tirami-infer/metal", "tirami-node/metal"]
cuda = ["tirami-infer/cuda", "tirami-node/cuda"]
rocm = ["tirami-infer/rocm", "tirami-node/rocm"]
vulkan = ["tirami-infer/vulkan", "tirami-node/vulkan"]

[dependencies]
tirami-core = { workspace = true }
tirami-infer = { workspace = true }
tirami-lightning = { workspace = true }
tirami-node = { workspace = true }
tirami-ledger = { workspace = true }
tirami-net = { workspace = true }
tirami-proto = { workspace = true }
iroh = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
